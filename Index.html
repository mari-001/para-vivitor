<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulário Especial</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma, sans-serif;
}

body{
    background:#e9e9e9;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.window{
    width:380px;
    background:white;
    border:2px solid #cfcfcf;
    border-radius:8px;
    box-shadow:0 0 15px rgba(0,0,0,.2);
    padding:25px;
}

h2{
    text-align:center;
    margin-bottom:20px;
    font-size:18px;
}

.center{
    text-align:center;
}

button{
    padding:10px 20px;
    border:none;
    cursor:pointer;
    margin:10px;
    font-weight:bold;
}

#sim{
    background:#76d35d;
}

#nao{
    background:#ff5757;
    color:white;
}

input{
    width:100%;
    padding:8px;
    margin-top:5px;
    margin-bottom:15px;
}

.hidden{
    display:none;
}

#heartScreen{
    position:fixed;
    inset:0;
    background:black;
    color:white;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    animation:fade .8s;
}

.heart{
    font-size:140px;
    animation:pulse 1s infinite;
}

.msg{
    font-size:32px;
    text-align:center;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.15);}
    100%{transform:scale(1);}
}

@keyframes fade{
    from{opacity:0}
    to{opacity:1}
}
</style>
</head>

<body>

<div class="window" id="inicio">

    <h2>Deseja abrir?</h2>

    <div class="center">
        <button id="sim">SIM</button>
        <button id="nao">NÃO</button>
    </div>

</div>

<div class="window hidden" id="formulario">

    <h2>SE VOCÊ É REALMENTE ELE(A),<br> PREENCHA O PEQUENO FORMULÁRIO</h2>

    <label>Nome</label>
    <input type="text" id="nome">

    <label>Sobrenome</label>
    <input type="text" id="sobrenome">

    <label>Nível de beleza</label>
    <input type="number" id="beleza">

    <button onclick="validar()">Próxima Página</button>

</div>

<div id="heartScreen">
    <div class="heart">❤️</div>
    <div class="msg">Amo você, Vivitor</div>
</div>

<script>

let fugidas = 0;
const sim = document.getElementById("sim");

sim.addEventListener("mouseover", () => {

    if(fugidas < 3){

        fugidas++;

        sim.style.position = "absolute";

        sim.style.left =
        Math.random() * (window.innerWidth - 100) + "px";

        sim.style.top =
        Math.random() * (window.innerHeight - 50) + "px";
    }

});

sim.addEventListener("click", () => {

    if(fugidas < 3){
        return;
    }

    document.getElementById("inicio").classList.add("hidden");
    document.getElementById("formulario").classList.remove("hidden");

});

document.getElementById("nao").onclick = () => {
    alert("Resposta incorreta 😠");
};

let etapa = 1;

function validar(){

    const sobrenome =
    document.getElementById("sobrenome");

    const beleza =
    document.getElementById("beleza");

    if(etapa === 1){

        sobrenome.value = "PAMONHA";

        alert(
        "Você errou o sobrenome.\nCorrija novamente."
        );

        etapa = 2;
        return;
    }

    if(etapa === 2){

        beleza.value = "999999999999999";

        alert(
        "Só isso de beleza?\nAgora sim 😎"
        );

        etapa = 3;

        setTimeout(() => {

            document.body.innerHTML = "";

            document.getElementById?.("heartScreen");

        },100);

        setTimeout(() => {

            const tela =
            document.createElement("div");

            tela.id = "heartScreen";

            tela.style.display = "flex";

            tela.innerHTML = `
            <div class="heart">❤️</div>
            <div class="msg">
            Amo você, Vivitor
            </div>
            `;

            document.body.appendChild(tela);

        },200);

    }

}
</script>

</body>
  </html>
