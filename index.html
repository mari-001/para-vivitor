<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Vitor ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,sans-serif;
}

body{
    background:#e9e9e9;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.window{
    width:380px;
    max-width:95%;
    background:white;
    border:2px solid #bdbdbd;
    border-radius:8px;
    padding:25px;
    box-shadow:0 0 15px rgba(0,0,0,.2);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

.center{
    text-align:center;
}

button{
    padding:10px 20px;
    border:none;
    cursor:pointer;
    margin:10px;
    font-weight:bold;
}

#sim{
    background:#66d566;
}

#nao{
    background:#ff5b5b;
    color:white;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
}

.hidden{
    display:none;
}

.heart-screen{
    position:fixed;
    inset:0;
    background:black;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.heart{
    font-size:160px;
    animation:pulse 1s infinite;
}

.msg{
    font-size:34px;
    text-align:center;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.15);}
    100%{transform:scale(1);}
}
</style>
</head>

<body>

<div class="window" id="inicio">

    <h2>Você deseja abrir, Vitor?</h2>

    <div class="center">
        <button id="sim">SIM</button>
        <button id="nao">NÃO</button>
    </div>

</div>

<div class="window hidden" id="formulario">

    <h2>
        SE VOCÊ É REALMENTE ELE,<br>
        PREENCHA O PEQUENO FORMULÁRIO
    </h2>

    <label>Nome</label>
    <input type="text" id="nome">

    <label>Sobrenome</label>
    <input type="text" id="sobrenome">

    <label>Nível de beleza</label>
    <input type="number" id="beleza">

    <button onclick="validar()">
        Próxima Página
    </button>

</div>

<script>

let fugidas = 0;
let etapa = 1;

const sim = document.getElementById("sim");

sim.addEventListener("click", () => {

    if(fugidas < 3){

        fugidas++;

        sim.style.position = "absolute";

        sim.style.left =
        Math.random() * (window.innerWidth - 120) + "px";

        sim.style.top =
        Math.random() * (window.innerHeight - 80) + "px";

        return;
    }

    document
    .getElementById("inicio")
    .classList.add("hidden");

    document
    .getElementById("formulario")
    .classList.remove("hidden");

});

document.getElementById("nao").onclick = () => {
    alert("Resposta incorreta 😠");
};

function validar(){

    const sobrenome =
    document.getElementById("sobrenome");

    const beleza =
    document.getElementById("beleza");

    if(etapa === 1){

        sobrenome.value = "PAMONHA";

        alert(
        "Sobrenome incorreto.\nCorrija novamente."
        );

        etapa = 2;
        return;
    }

    if(etapa === 2){

        alert(
        "Só isso de beleza?\nAgora sim 😎"
        );

        beleza.value = "999999999999999";

        etapa = 3;

        setTimeout(() => {

            document.body.innerHTML = `
            <div class="heart-screen">
                <div class="heart">❤️</div>
                <div class="msg">
                    Amo você, Vivitor
                </div>
            </div>
            `;

        }, 2700);

        return;
    }

}

</script>

</body>
</html>
